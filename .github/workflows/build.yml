name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleRemoto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar o log do erro no repositorio (so se falhar)
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logpub
          cp build.log /tmp/logpub/build.log 2>/dev/null || echo "sem build.log (falhou antes do Gradle)" > /tmp/logpub/build.log
          cd /tmp/logpub
          git init -q -b build-log
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build.log
          git commit -q -m "log do build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
